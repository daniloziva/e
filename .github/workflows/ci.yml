name: CI

# The M0 quality gate (07-ROADMAP.md §M0): lint → typecheck → unit → build.
#
# The repo root is E/; the app lives in E/e-app, so every step runs there.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: e-app

jobs:
  gate:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e-app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Blocking. Enforces the engine/ → adapters/ import ban, the no-any rule,
      # and the test-freeze bans (bare .toThrow, .only/.skip).
      - name: Lint
        run: pnpm lint

      # Blocking. Was clean at the freeze and must stay clean.
      - name: Typecheck
        run: pnpm typecheck

      # ─────────────────────────────────────────────────────────────────────
      # BLOCKING as of 2026-08-17.
      #
      # It was not, and the reason was good: the suite was frozen at TDD RED —
      # 2,771 cases failing on `not implemented` by design (TEST-FREEZE.md). A
      # blocking step would have been red on every commit until the last module
      # landed, which trains everyone to ignore CI. That is worse than no CI.
      #
      # That condition is gone. The engine is implemented, the six known-wrong
      # assertions were unfrozen and satisfied, and the suite is 3,132/3,132.
      # A non-blocking gate now reports failures nobody is obliged to fix, which
      # is the same trained indifference by a slower route.
      # ─────────────────────────────────────────────────────────────────────
      - name: Unit suite
        id: unit
        continue-on-error: false
        # `shell: bash` is load-bearing, not style. GitHub's default runner shell
        # is `bash -e {0}` with NO pipefail, so the exit status of
        # `pnpm test | tee` is TEE's — always 0. Without this line the step can
        # never fail, `steps.unit.outcome` is hard-wired to `success`, and the
        # summary below reports a success it did not measure. Anyone flipping
        # `continue-on-error` to false would get a gate that gates nothing.
        shell: bash
        run: pnpm test --reporter=basic 2>&1 | tee unit.log

      # BLOCKING as of 2026-08-17, together with the unit step above.
      #
      # These thresholds were DECORATIVE from M0 until now — declared in
      # vitest.config.ts and never once executed. Two independent reasons, both
      # since fixed: `pnpm test` does not compute coverage (so the numbers were
      # never produced in CI), and vitest's `coverage.reportOnFailure` defaults to
      # FALSE (so a red suite emitted no report and evaluated no threshold —
      # coverage stopped being checked at exactly the moment the code was broken).
      # `reportOnFailure: true` is now set explicitly in vitest.config.ts.
      #
      # Measured at the flip: branches 92.36% against a 90% threshold, 44 branches
      # of margin. The flip was held until there was margin, because a gate that
      # blocks on the first routine commit gets its threshold lowered, and a
      # threshold lowered to fit is worse than no threshold at all.
      #
      # DO NOT LOWER THE THRESHOLD TO MAKE A BUILD PASS. Write the test.
      - name: Coverage
        id: cov
        continue-on-error: false
        # Same pipefail reasoning as the unit step above.
        shell: bash
        run: pnpm coverage 2>&1 | tail -40 | tee coverage.log

      - name: Report suite counts
        if: always()
        run: |
          {
            echo "### Unit suite"
            echo ''
            echo '```'
            grep -E '^ *(Test Files|Tests) ' unit.log || echo 'no summary line found'
            echo '```'
            echo ''
            echo "Outcome: \`${{ steps.unit.outcome }}\` — this step is BLOCKING as of 2026-08-17. A failure is a regression, not the freeze baseline."
            echo ''
            echo "### Coverage (src/engine/**)"
            echo ''
            echo '```'
            grep -E '^(All files|% ?Coverage|ERROR: Coverage)' coverage.log || tail -5 coverage.log || echo 'no coverage output'
            echo '```'
            echo ''
            echo "Outcome: \`${{ steps.cov.outcome }}\` — BLOCKING as of 2026-08-17. Thresholds 95% lines / 90% branches. Fix by writing the test, never by lowering the threshold."
          } >> "$GITHUB_STEP_SUMMARY"

      # Blocking. Proves src/ still emits.
      - name: Build
        run: pnpm build

  # ───────────────────────────────────────────────────────────────────────────
  # BLOCKING as of 2026-08-18. Was a placeholder with `if: false` from M0 until
  # `src/adapters/store/blob-store.ts` existed.
  #
  # This job exists for exactly two assertions: `putIfAbsent` returns 409 on the
  # second call, and `casPut` returns 412 on a stale ETag. `06-TDD-STRATEGY.md`
  # §L2 calls them "the load-bearing guarantees of the whole no-database design",
  # because every other mechanism — dedupe by content hash, idempotent events, the
  # review queue, mutable `_state` — is built from those two plus prefix listing.
  # If they do not hold, choosing Blob Storage over a database was wrong, and
  # nothing else in E would tell us.
  #
  # It runs the SAME cases as the in-memory fake: `blob-store.contract.ts` is a
  # function, invoked from both `.fake.test.ts` and `.azurite.test.ts`. That is the
  # whole design — a guarantee verified only against a fake we wrote ourselves is
  # not verified, and a fake that drifts silently invalidates every use-case test
  # above it.
  # ───────────────────────────────────────────────────────────────────────────
  contract:
    name: contract (Azurite)
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e-app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Azurite runs from the devDependency, NOT as a service container.
      #
      # A service container cannot take a command — GitHub's `options` maps to
      # `docker create` flags — and `--skipApiVersionCheck` is REQUIRED, not
      # tidying: Azurite 3.36 refuses the API version @azure/storage-blob 12.33
      # sends (2026-06-06) and fails the connection outright. Every operation used
      # here (upload, download, list, delete, If-None-Match, If-Match) long
      # predates that version, and this suite is what proves they behave; Azurite
      # suggests the flag in its own error text.
      #
      # Running it from the devDependency also means CI and a laptop execute the
      # byte-identical command, so the two cannot drift.
      - name: Start Azurite
        shell: bash
        run: |
          pnpm exec azurite-blob --silent --skipApiVersionCheck \
            --location "${RUNNER_TEMP}/azurite" --blobPort 10000 &
          for _ in $(seq 1 30); do
            # Any HTTP response means it is listening; unauthenticated probes
            # legitimately answer 400/403, so `curl -f` would be wrong here.
            if curl -s -o /dev/null "http://127.0.0.1:10000/devstoreaccount1"; then
              echo "azurite listening"; exit 0
            fi
            sleep 1
          done
          echo "azurite did not start within 30s"; exit 1

      # Blocking. The suite FAILS rather than skips when Azurite is unreachable —
      # a contract job that quietly skips is the decorative gate the coverage
      # thresholds were for eight milestones.
      - name: Contract suite (blob store vs Azurite)
        run: pnpm test:contract
